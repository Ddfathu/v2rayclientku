name: Build dfathuv2ray APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '10i\ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts || true

      - name: Compile libhevtun
        run: |
          chmod +x compile-hevtun.sh || true
          bash compile-hevtun.sh
          mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
          cp -r ${{ github.workspace }}/libs/* ${{ github.workspace }}/V2rayNG/app/libs/ 2>/dev/null || true

      - name: Fetch AndroidLibXrayLite Tag & Download Core
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          popd
          echo "Using Tag: $CURRENT_TAG"
          mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
          curl -L -o ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"

      - name: Build Debug APK with Error Logger
        id: gradle_build
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          # Menjalankan build sambil mencatat log
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show Exact Error Message
        if: failure()
        run: |
          echo "==================== RINGKASAN ERROR KODINGAN ===================="
          # Mencari pesan error Kotlin/Java, baris yang bermasalah, dan penyebab kegagalan
          grep -E "(e: |FAILURE: |Unresolved reference|A failure occurred)" ${{ github.workspace }}/V2rayNG/build.log || tail -n 60 ${{ github.workspace }}/V2rayNG/build.log
          echo "================================================================="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dfathuv2ray-APK
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/debug/*.apk
          retention-days: 7
