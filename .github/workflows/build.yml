name: Build dfathuv2ray APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Core Libs
        run: |
          mkdir -p V2rayNG/app/libs
          if [ -d "AndroidLibXrayLite" ]; then
            find AndroidLibXrayLite -name "*.aar" -exec cp {} V2rayNG/app/libs/ \;
          fi

      - name: Grant Execute Permission for Gradlew
        working-directory: V2rayNG
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: V2rayNG
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfathuv2ray-APK
          path: |
            V2rayNG/app/build/outputs/apk/**/*.apk
          retention-days: 7
